# ExchangeOS — Lefthook HARD-enforcement (FX-COMMIT-001..025)
# 3 tiers:
#   pre-commit  < 30s  (Tier 1 — fast feedback)
#   pre-push    CI local via act (Tier 2; first run per sha is long, then cached)
#   pre-merge   <15min (Tier 3 — full coverage; runs via CI only)
#
# Bypass: scripts/git-hooks-wrapper.sh blocks --no-verify; EMERGENCY_BYPASS=true
# requires reason + appends to .git/audit-bypass.log + Slack alert.

assert_lefthook_installed: true
no_tty: false
skip_output:
  - meta
  - success

# ─── Tier 1: pre-commit (< 30s) ─────────────────────────────────────────────
pre-commit:
  parallel: true
  commands:
    fmt:
      glob: "*.go"
      run: gofmt -l -s {staged_files} | tee /tmp/_exos_fmt && test ! -s /tmp/_exos_fmt
      fail_text: "gofmt found unformatted files (run: task fmt)"

    secrets:
      run: gitleaks protect --staged --redact --no-banner
      fail_text: "gitleaks detected potential secrets — see output above"

    proto-lint:
      glob: "*.proto"
      run: buf lint

    yaml-lint:
      glob: "*.{yaml,yml}"
      run: |
        if command -v yamllint >/dev/null 2>&1; then
          yamllint -d "{extends: default, rules: {line-length: {max: 200}, document-start: disable, truthy: {check-keys: false}}}" {staged_files}
        else
          echo "(yamllint not installed — skipping)"
        fi

# ─── Tier 2: pre-push ───────────────────────────────────────────────────────────
# Only the CI local (dono, 2026-11-18, MS-024i 1.29): scripts/ci-local/run.sh runs the pull_request workflows
# (ci.yml, go-floor.yml, security.yml) through act, in the heavy-gate queue, and caches the result per sha.
# Those workflows cover what this tier ran before: go test -race, golangci-lint, govulncheck, the BACEN codegen
# drift and go vet. Running them here as well would compile and test twice, outside the queue.
pre-push:
  parallel: false
  commands:
    ci-local:
      # The pushed sha goes to run.sh as PRE_COMMIT_TO_REF (first non-deletion ref on stdin), so it refuses a push
      # whose commit is not HEAD (baremetal ci-local-servico README, 2624932e; MS-024i 1.35).
      use_stdin: true
      run: >-
        while read -r _ s _ _; do case "$s" in *[!0]*) t="$s"; break;; esac; done;
        PRE_COMMIT_TO_REF="$t" scripts/ci-local/run.sh
      fail_text: "CI local (act) failed — see the output above; never --no-verify"

# ─── commit-msg: Conventional Commits enforcement ───────────────────────────
commit-msg:
  commands:
    conventional:
      run: |
        head -n1 "{1}" | grep -E '^(feat|fix|chore|docs|refactor|test|perf|ci|build|revert)(\(.+\))?!?: .+' >/dev/null \
          || (echo "Commit subject must follow Conventional Commits (e.g. 'feat(trade): ...')"; exit 1)
