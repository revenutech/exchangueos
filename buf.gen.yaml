version: v2

managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/revenutech/exchangeos/proto/gen

plugins:
  # Plugins locais, versões fixas no CI (MS-024i 1.32): o remoto do BSR, sem login, devolve «too many requests».
  - local: protoc-gen-go
    out: proto/gen
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: proto/gen
    opt:
      - paths=source_relative
      - require_unimplemented_servers=false
