name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26.11'

jobs:
  # ─── Lint / format / proto ───────────────────────────────────────────────
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # o golangci-lint compara com issues.new-from-rev (.golangci.yml)

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # proto/gen fica fora do git e o build padrão o importa (SettlementService, MS-079 7.5): gere antes
      # de compilar (MS-024i 1.32).
      - uses: bufbuild/buf-setup-action@v1
      - name: buf generate
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          buf generate

      - name: go vet + fmt
        run: |
          go vet ./...
          gofmt -l -s . | tee /tmp/_fmt
          test ! -s /tmp/_fmt

      - uses: bufbuild/buf-setup-action@v1
      - run: buf lint

      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.15.0
          args: --timeout 5m

      - name: bacen codegen drift guard
        run: bash scripts/check-bacen-codegen.sh

  # ─── Unit tests w/ race + coverage ───────────────────────────────────────
  test:
    name: test (ubuntu-latest)
    # runs-on literal: com `${{ matrix.os }}` o act às vezes sobe esta perna sem imagem (MS-024i 1.32); macOS e
    # Windows ficam no job test-os, que o act pula (sem -P para eles) e o GitHub roda.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # proto/gen fica fora do git e o build padrão o importa (SettlementService, MS-079 7.5): gere antes
      # de compilar (MS-024i 1.32).
      - uses: bufbuild/buf-setup-action@v1
      - name: buf generate
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          buf generate

      - name: test
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  test-os:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # proto/gen fica fora do git e o build padrão o importa (SettlementService, MS-079 7.5): gere antes
      # de compilar (MS-024i 1.32).
      - uses: bufbuild/buf-setup-action@v1
      - name: buf generate
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          buf generate

      - name: test
        run: go test -race -count=1 ./...

  # ─── Build all 7 binaries ────────────────────────────────────────────────
  build:
    name: build
    needs: [lint]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        bin: [api, worker, migrator, cls-cycle, eod, mq-bridge, cred-rotator]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # proto/gen fica fora do git e o build padrão o importa (SettlementService, MS-079 7.5): gere antes
      # de compilar (MS-024i 1.32).
      - uses: bufbuild/buf-setup-action@v1
      - name: buf generate
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          buf generate

      - run: |
          mkdir -p bin
          go build -trimpath -ldflags '-s -w' -o bin/exchangeos-${{ matrix.bin }} ./cmd/${{ matrix.bin }}

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.bin }}
          path: bin/exchangeos-${{ matrix.bin }}
          retention-days: 3

  # ─── Docker build (only api for PR; multi-bin on main) ───────────────────
  docker-build:
    name: docker (${{ matrix.bin }})
    needs: [build, test, test-os]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        bin: [api]
    steps:
      - uses: actions/checkout@v4
      # O build da imagem compila o cmd/api, que importa o proto/gen (fora do git): gere antes (MS-024i 1.32).
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: bufbuild/buf-setup-action@v1
      - name: buf generate
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          buf generate
      - uses: docker/setup-buildx-action@v3
      - name: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.bin }}/Dockerfile
          push: false
          platforms: linux/amd64
          tags: exchangeos-${{ matrix.bin }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
