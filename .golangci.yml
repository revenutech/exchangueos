# ExchangeOS — golangci-lint config (FX-GP-040)
# Strict by default; explicit excludes only where noisy.

version: "2"

run:
  timeout: 5m
  go: "1.25"
  build-tags:
    - integration
    - e2e

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosec
    - revive
    - misspell
    - gocyclo
    - dupl
    - goconst
    - prealloc
    - gocritic
    - bodyclose
    - noctx
    - nilerr
    - exhaustive
    - errorlint
    - copyloopvar
    - intrange
    - sqlclosecheck
    - rowserrcheck
    - asasalint
    - asciicheck
    - durationcheck
    - errchkjson
    - forbidigo
    - gocheckcompilerdirectives
    - gosmopolitan

  settings:
    gocyclo:
      min-complexity: 15
    revive:
      severity: warning
      rules:
        - name: var-naming
        - name: exported
        - name: package-comments
        - name: indent-error-flow
        - name: range-val-in-closure
        - name: unhandled-error
          arguments:
            - "fmt.Println"
            - "fmt.Printf"
    gosec:
      excludes:
        - G115  # integer overflow (false positives w/ proto sizes)
    forbidigo:
      forbid:
        - pattern: '^float64\s+'
          msg: "NEVER float64 for money/rate — use shopspring/decimal.Decimal"
        - pattern: '^float32\s+'
          msg: "NEVER float32 for money/rate — use shopspring/decimal.Decimal"

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - dupl
          - gocyclo
          - errcheck
      - path: proto/gen/
        linters:
          - revive
          - unused
          - staticcheck
          - gosec

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  # Ratchet da dívida antiga (RPTN.091.026.01; decisão do dono, 2026-11-19, MS-024i 1.32): só reprova achado
  # em linha mudada depois deste commit. A dívida de antes (2567 linhas, revive 670) é a linha 1.33 do MS-024i;
  # o rev só anda para frente quando ela baixar.
  # ratchet: teto
  # controle-negativo: tests/ci-local/golangci-novo-reprova.sh
  new-from-rev: 0ddc368193b17ba1764afd4cf247020582cc2c3c
