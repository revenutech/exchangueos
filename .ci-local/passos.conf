# Passos da N1 por escopo e da N2 por lote do exchangeos (rodada-escopo.sh da Baremetal, MS-023 1.7; etapa 9).
# Modelo: baremetal scripts/ci-local-servico/exemplos/passos.conf (main 55d6e8dc). Os passos são os da N2 do lote 9.1
# (88938b8), com a chave estreita da CONVENTIONS § 6.7: cada passo só lista o que lê. go.mod e go.sum, a fila soma
# sozinha; mudança em go.mod, go.sum ou .ci-local/ amplia para todos.
# O proto/gen/ é gerado e ignorado pelo git: rodar `buf generate` (ou copiar o proto/gen) antes, como no build.
# A catraca de cobertura por pacote (head × base) é linha `n2`: só roda na N2 do lote, com CATRACA_BASE=<base do lote>.
# Ficaram de fora, por estarem vermelhos na develop 2f11168 antes da migração para o passos.conf: golangci-lint
# (2567 linhas, revive 670), gosec -severity high (4 achados) e buf lint (2 achados). O golangci-lint entrou na MS-024i
# 1.37 (dono, 21/11) com o ratchet do .golangci.yml (issues.new-from-rev, MS-024i 1.32): a dívida velha não reprova,
# achado novo reprova. Sem ele a N1 deixou passar 46 achados da MS-024d que o lint do ci.yml pegou no run.sh (e2799dd).

# Go: um passo por pacote, com -race. A chave é o pacote e os pacotes do módulo de que ele depende, mais o que os
# pacotes leem do disco (escopo.conf, «le-disco»): data/ (pkg/bacen) e schemas/ (internal/erasure). O .cache/xsd/
# é ignorado pelo git e não muda em diff.
go teste ./... data,schemas -- go test -race -count=1 {pkg}

# Árvore Go inteira.
build cmd,internal,modules,pkg,proto,tests -- go build ./... && go vet ./...
govulncheck cmd,internal,modules,pkg,proto -- govulncheck ./...

# golangci-lint com ratchet (só achado novo desde o new-from-rev). A versão é a do ci.yml (v2.15.0). O controle negativo
# prova que o ratchet não está cego.
golangci cmd,internal,modules,pkg,proto,tests,.golangci.yml -- golangci-lint run --timeout 10m ./...
golangci-controle .golangci.yml,tests/ci-local/golangci-novo-reprova.sh -- tests/ci-local/golangci-novo-reprova.sh

# Migrações: ida e volta num CockroachDB TLS descartável (pista COM banco: rode a rodada sem REVENU_GATE_SEM_BANCO
# quando o `lista` mostrar este passo entrando). Marcado `banco integration` (MS-023 1.39): o script sobe o banco e
# exporta EXCHANGEOS_TEST_DSN para os pacotes de tests/ci-local/migracoes/go-integracao.txt (go test -tags integration).
# Os _test.go não leem a variável: chamam dbtest.PoolOrSkip, por isso o `banco-helper` abaixo. O script imprime as
# linhas do go test -v (--- PASS), que o driver conta num passo banco (1.39, item 13).
banco-helper internal/dbtest
# Passo de disco: a cobertura dos pacotes de banco vem declarada (1.39, pergunta 18); a lista é a do go-integracao.txt.
banco-cobre migracoes internal/archive,modules/admin/infrastructure/postgres,modules/cfets_capture/infrastructure/postgres,modules/cfets_confirmation/infrastructure/postgres,modules/compliance/infrastructure/postgres,modules/netreport/infrastructure/postgres,modules/payin/infrastructure/postgres,tests/integration
banco integration migracoes migrations,cmd/migrator,internal/config,internal/telemetry,internal/archive,internal/dbtest,modules/admin/infrastructure/postgres,modules/cfets_capture/infrastructure/postgres,modules/cfets_confirmation/infrastructure/postgres,modules/compliance/infrastructure/postgres,modules/netreport/infrastructure/postgres,modules/payin/infrastructure/postgres,tests/integration,tests/ci-local/migracoes-ida-e-volta.sh,tests/ci-local/migracoes -- tests/ci-local/migracoes-ida-e-volta.sh

# O tests/integration (mock do BACEN + erasure) roda inteiro no passo `migracoes`, com banco; os testes do servidor
# vivo em :8084 ficaram atrás da tag `vivo` e não compilam aqui. O antigo passo `bacen-mock` saiu: era um passo sem
# banco sobre um pacote de banco.

# Chart.
helm deploy/helm/exchangeos -- helm lint deploy/helm/exchangeos && helm template exchangeos deploy/helm/exchangeos >/dev/null

# Gates do disco: o controle do escopo sensível (lê o .ci-local/ e a árvore no base) e o lint dos padrões.
escopo .ci-local,tests/ci-local -- tests/ci-local/escopo-controle-negativo.sh
passos .ci-local,tests/ci-local -- tests/ci-local/passos-controle-negativo.sh
lint-patterns scripts/lint-patterns.sh,tests/scripts -- tests/scripts/lint-patterns_test.sh
catraca-controle scripts/ci-local,tests/ci-local/catraca-controle-negativo.sh -- tests/ci-local/catraca-controle-negativo.sh
shellcheck scripts,tests/ci-local,tests/scripts -- shellcheck scripts/lint-patterns.sh scripts/ci-local/*.sh tests/ci-local/*.sh tests/scripts/*.sh

# Só na N2 do lote: catraca de cobertura head × base (CATRACA_BASE = base do lote; sem ela o passo sai 2 e reprova).
n2 catraca . -- scripts/ci-local/catraca.sh

# Segredos: o histórico do head lê o repositório inteiro.
gitleaks . -- gitleaks git --log-opts=HEAD --redact --no-banner .
