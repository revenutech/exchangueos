# Escopo sensível do exchangeos (CONVENTIONS § 6.10), no modelo de baremetal scripts/ci-local-servico/exemplos/ledgeros-escopo.conf.
# Formato: «<categoria> <padrão>» por linha; # comenta. Categorias: dinheiro, tenant, assinatura, pii, contrato, catalogo.
# O padrão é glob do bash contra o caminho a partir da raiz (o * passa por /) e casa também tudo abaixo dele.
# Um arquivo do diff que case faz o --nivel responder «amplia» com «motivo: <categoria>: <caminho>».
# «le-disco <pacote> <glob>»: pacote que lê do disco fora dele; o --leituras confere e o --nivel o põe no escopo.
# Caminhos conferidos na develop do exchangeos (663fdaf) em 2026-11-10. Caminho ainda vazio vale para o código que vier.

dinheiro   modules/trade/
dinheiro   modules/quote/domain/
dinheiro   modules/amendment/
dinheiro   modules/settlement/
dinheiro   modules/cls_settlement/
dinheiro   modules/payin/
dinheiro   modules/netreport/
dinheiro   modules/position/
dinheiro   modules/risk/domain/
dinheiro   pkg/money/
dinheiro   pkg/decimal/
dinheiro   pkg/pricing/
dinheiro   pkg/fxrate/
dinheiro   pkg/cls/

tenant     internal/auth/
tenant     internal/middleware/
tenant     internal/adminapi/
tenant     migrations/000001_create_tenants*

assinatura pkg/signer/
assinatura internal/vault/
assinatura cmd/cred-rotator/
assinatura internal/credrotator/
assinatura pkg/bacen/submission/
assinatura pkg/siscoaf/

pii        modules/compliance/
pii        internal/erasure/
pii        cmd/erasure-worker/
pii        pkg/sanctions/
pii        pkg/siscoaf/
pii        pkg/bacen/submission/

contrato   proto/
contrato   schemas/
contrato   pkg/iso20022/

catalogo   .base/aasc/

le-disco github.com/revenutech/exchangeos/internal/erasure schemas/erasure-plan-v1.json
