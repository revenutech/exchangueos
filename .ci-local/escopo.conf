# Escopo sensível do exchangeos (CONVENTIONS § 6.10), no modelo de baremetal scripts/ci-local-servico/exemplos/ledgeros-escopo.conf.
# Formato: «<categoria> <padrão>» por linha; # comenta. Categorias: dinheiro, tenant, assinatura, pii, contrato, catalogo.
# O padrão é glob do bash contra o caminho a partir da raiz (o * passa por /) e casa também tudo abaixo dele.
# Um arquivo do diff que case faz o --nivel responder «amplia» com «motivo: <categoria>: <caminho>».
# «le-disco <pacote> <glob>»: pacote que lê do disco fora dele; o --leituras confere e o --nivel o põe no escopo.
# Caminhos conferidos na develop do exchangeos (663fdaf) em 2026-11-10. Caminho ainda vazio vale para o código que vier.

# quote/ e risk/ inteiros: o application também decide valor (decimal), não só o domain (revisão Baremetal 10/11).
# pkg/bacen/ inteiro: o IOFCalculator calcula imposto sobre o nocional (RN_FX_037).
